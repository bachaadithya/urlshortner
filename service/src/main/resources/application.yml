server:
  port: 8081

spring:
  application:
    name: url-shortener-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/urlshortener}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  api-key: ${API_KEY:dev-api-key-change-me}
  short-code-length: 7
  max-generation-retries: 5
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:3600}
  bloom:
    expected-insertions: 1000000
    fpp: 0.01
  reserved-aliases:
    - api
    - actuator
    - health
    - metrics
    - favicon.ico
    - robots.txt

logging:
  level:
    com.urlshortener: INFO
