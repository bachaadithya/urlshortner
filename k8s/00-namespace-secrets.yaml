apiVersion: v1
kind: Namespace
metadata:
  name: urlshortener
---
apiVersion: v1
kind: Secret
metadata:
  name: urlshortener-secrets
  namespace: urlshortener
type: Opaque
stringData:
  API_KEY: "replace-with-strong-api-key"
  MONGODB_URI: "mongodb://doadmin:PASSWORD@private-mongodb-host:27017/urlshortener?tls=true&authSource=admin"
  REDIS_HOST: "private-redis-host"
  REDIS_PASSWORD: "replace-with-redis-password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: urlshortener-config
  namespace: urlshortener
data:
  PUBLIC_BASE_URL: "https://short.example.com"
  REDIS_PORT: "6379"
  CACHE_TTL_SECONDS: "3600"
  SERVICE_URI: "http://url-shortener-service:8081"
